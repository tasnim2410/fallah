<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#15803d">
  <meta name="page-title-key" content="admin.title">
  <title>لوحة البائع — فلّاح</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="فلّاح">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">
          <img src="/straw_hat_logo.svg" alt="">
        </span>
        <span>
          <span data-i18n="admin.title"></span>
          <small class="brand__tag" data-i18n="admin.subtitle"></small>
        </span>
      </a>
      <nav class="site-nav" aria-label="Navigation">
        <div class="lang-switch" data-lang-switch></div>
        <button type="button" class="btn btn--ghost btn--sm always-visible" id="logout" hidden>
          <span data-icon="logout"></span>
          <span data-i18n="admin.logout"></span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container">

      <!-- ---------------------------- Connexion --------------------- -->
      <section id="login-view">
        <form class="panel" id="login-form" style="max-width: 420px; margin-inline: auto" novalidate>
          <h1 class="panel__title">
            <span data-icon="lock"></span>
            <span data-i18n="admin.title"></span>
          </h1>
          <div class="field" data-field="password">
            <label class="field__label" for="password" data-i18n="admin.password"></label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
            <span class="field__error" data-error-for="password"></span>
          </div>
          <button type="submit" class="btn btn--block" data-i18n="admin.login"></button>
        </form>
      </section>

      <!-- --------------------------- Tableau de bord ---------------- -->
      <section id="dash-view" hidden>
        <div class="stats" id="stats"></div>

        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-orders" aria-selected="true" data-tab="orders" data-i18n="admin.tabOrders"></button>
          <button type="button" role="tab" id="tab-products" aria-selected="false" data-tab="products" data-i18n="admin.tabProducts"></button>
          <button type="button" role="tab" id="tab-promotions" aria-selected="false" data-tab="promotions" data-i18n="admin.tabPromotions"></button>
          <button type="button" role="tab" id="tab-settings" aria-selected="false" data-tab="settings" data-i18n="admin.tabSettings"></button>
        </div>

        <!-- Commandes -->
        <div id="panel-orders" role="tabpanel" aria-labelledby="tab-orders">
          <div class="catalog-bar">
            <div class="search-field">
              <span data-icon="search"></span>
              <label class="visually-hidden" for="order-search" data-i18n="admin.searchOrders"></label>
              <input type="search" id="order-search" data-i18n-placeholder="admin.searchOrders" autocomplete="off">
            </div>
            <div class="chips" id="status-filters" role="group"></div>
            <button type="button" class="btn btn--ghost btn--sm" id="refresh">
              <span data-icon="refresh"></span>
              <span data-i18n="admin.refresh"></span>
            </button>
          </div>
          <div id="orders" aria-live="polite"></div>
        </div>

        <!-- Produits -->
        <div id="panel-products" role="tabpanel" aria-labelledby="tab-products" hidden>
          <div class="catalog-bar">
            <button type="button" class="btn" id="add-product">
              <span data-icon="plus"></span>
              <span data-i18n="p.add"></span>
            </button>
          </div>

          <div class="panel table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th colspan="2" data-i18n="admin.pName"></th>
                  <th data-i18n="admin.pPrice"></th>
                  <th data-i18n="admin.pStock"></th>
                  <th data-i18n="admin.pAvailable"></th>
                  <th><span class="visually-hidden" data-i18n="admin.save"></span></th>
                </tr>
              </thead>
              <tbody id="products-body"></tbody>
            </table>
          </div>
        </div>

        <!-- Offres -->
        <div id="panel-promotions" role="tabpanel" aria-labelledby="tab-promotions" hidden>
          <div class="catalog-bar">
            <button type="button" class="btn" id="add-promotion">
              <span data-icon="plus"></span>
              <span data-i18n="promo.add"></span>
            </button>
          </div>

          <div class="panel table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th data-i18n="promo.colTitle"></th>
                  <th data-i18n="promo.colRule"></th>
                  <th data-i18n="promo.colActive"></th>
                  <th><span class="visually-hidden" data-i18n="admin.save"></span></th>
                </tr>
              </thead>
              <tbody id="promotions-body"></tbody>
            </table>
          </div>
        </div>

        <!-- Réglages -->
        <div id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
          <form class="panel" id="settings-form" style="max-width: 560px" novalidate>
            <h2 class="panel__title">
              <span data-icon="phone"></span>
              <span data-i18n="admin.secContact"></span>
            </h2>
            <div class="field" data-field="shopPhone">
              <label class="field__label" for="s-shop-phone" data-i18n="admin.shopPhone"></label>
              <input type="tel" id="s-shop-phone" name="shopPhone" maxlength="20"
                     data-i18n-placeholder="admin.shopPhonePh">
              <span class="field__error" data-error-for="shopPhone"></span>
            </div>

            <h2 class="panel__title" style="margin-block-start: var(--space-5)">
              <span data-icon="truck"></span>
              <span data-i18n="admin.secDelivery"></span>
            </h2>
            <div class="form-grid">
              <div class="field" data-field="delivery">
                <label class="field__label" for="s-delivery" data-i18n="admin.deliveryPrice"></label>
                <input type="number" id="s-delivery" name="delivery" min="0" max="100" step="0.001" required>
                <span class="field__error" data-error-for="delivery"></span>
              </div>
              <div class="field" data-field="freeDeliveryFrom">
                <label class="field__label" for="s-free-from" data-i18n="admin.freeDeliveryFrom"></label>
                <input type="number" id="s-free-from" name="freeDeliveryFrom" min="0" max="1000" step="0.001" required>
                <span class="field__error" data-error-for="freeDeliveryFrom"></span>
              </div>
            </div>

            <div class="switch-row">
              <label class="switch">
                <input type="checkbox" id="s-always-free" name="alwaysFree">
                <span data-i18n="admin.alwaysFree"></span>
              </label>
            </div>

            <div class="switch-row">
              <label class="switch">
                <input type="checkbox" id="s-daily-delivery" name="dailyDelivery" checked>
                <span data-i18n="admin.dailyDelivery"></span>
              </label>
            </div>
            <div class="field" data-field="nextDeliveryDate" id="delay-field">
              <label class="field__label" for="s-next-delivery" data-i18n="admin.nextDeliveryDate"></label>
              <input type="date" id="s-next-delivery" name="nextDeliveryDate">
              <span class="field__error" data-error-for="nextDeliveryDate"></span>
            </div>
            <div class="field">
              <label class="field__label" for="s-delivery-note" data-i18n="admin.deliveryNote"></label>
              <textarea id="s-delivery-note" name="deliveryNote" maxlength="200" rows="2" dir="auto"
                        data-i18n-placeholder="admin.deliveryNotePh"></textarea>
            </div>

            <h2 class="panel__title" style="margin-block-start: var(--space-5)">
              <span data-icon="pin"></span>
              <span data-i18n="admin.secPickup"></span>
            </h2>
            <div class="switch-row">
              <label class="switch">
                <input type="checkbox" id="s-pickup-enabled" name="pickupEnabled">
                <span data-i18n="admin.pickupEnabled"></span>
              </label>
            </div>
            <div class="field" data-field="pickupPlace">
              <label class="field__label" for="s-pickup-place" data-i18n="admin.pickupPlace"></label>
              <textarea id="s-pickup-place" name="pickupPlace" maxlength="300" rows="2" dir="auto"
                        data-i18n-placeholder="admin.pickupPlacePh"></textarea>
              <span class="field__error" data-error-for="pickupPlace"></span>
            </div>

            <div class="field map-field" data-field="pickupPin">
              <span class="field__label" id="s-pin-label">
                <span data-i18n="admin.pickupMap"></span>
                <span class="badge badge--soft" data-i18n="form.pinOptional"></span>
              </span>

              <button type="button" class="btn btn--ghost btn--block" id="s-pin-open">
                <span data-icon="pin"></span>
                <span data-i18n="form.pinOpen"></span>
              </button>

              <div class="map-picker" id="s-pin-picker" hidden>
                <div class="map" id="s-pin-map" tabindex="0" role="application"
                     aria-describedby="s-pin-help" data-i18n-aria="admin.pickupMap">
                  <div class="map__crosshair" aria-hidden="true">
                    <span data-icon="pin"></span>
                  </div>
                  <div class="map__zoom">
                    <button type="button" data-map-zoom="1" data-i18n-aria="form.pinZoomIn">+</button>
                    <button type="button" data-map-zoom="-1" data-i18n-aria="form.pinZoomOut">−</button>
                  </div>
                  <p class="map__credit">
                    ©&nbsp;<a href="https://www.openstreetmap.org/copyright" target="_blank"
                              rel="noopener">OpenStreetMap</a>
                  </p>
                </div>

                <p class="field__hint" id="s-pin-help" data-i18n="admin.pickupMapHelp"></p>

                <div class="map-picker__actions">
                  <button type="button" class="btn btn--sm" id="s-pin-locate">
                    <span data-icon="target"></span>
                    <span data-i18n="form.pinLocate"></span>
                  </button>
                  <button type="button" class="btn btn--sm btn--accent" id="s-pin-confirm">
                    <span data-icon="check"></span>
                    <span data-i18n="form.pinConfirm"></span>
                  </button>
                  <button type="button" class="btn btn--sm btn--ghost" id="s-pin-cancel" data-i18n="form.pinCancel"></button>
                </div>
              </div>

              <div class="map-pinned" id="s-pin-summary" hidden>
                <span data-icon="pin"></span>
                <span class="map-pinned__text">
                  <strong data-i18n="form.pinSaved"></strong>
                  <span class="map-pinned__coords" id="s-pin-coords" dir="ltr"></span>
                </span>
                <button type="button" class="btn btn--sm btn--ghost" id="s-pin-clear" data-i18n="form.pinClear"></button>
              </div>

              <input type="hidden" name="pickupLat" id="s-pin-lat">
              <input type="hidden" name="pickupLng" id="s-pin-lng">
              <span class="field__error" data-error-for="pickupPin"></span>
            </div>

            <h2 class="panel__title" style="margin-block-start: var(--space-5)">
              <span data-icon="tag"></span>
              <span data-i18n="admin.secAnnouncement"></span>
            </h2>
            <div class="switch-row">
              <label class="switch">
                <input type="checkbox" id="s-announce-active" name="announcementActive">
                <span data-i18n="admin.announceActive"></span>
              </label>
            </div>
            <div class="field">
              <label class="field__label" for="s-announce-title" data-i18n="admin.announceTitle"></label>
              <input type="text" id="s-announce-title" name="announcementTitle" maxlength="80" dir="auto">
            </div>
            <div class="field">
              <label class="field__label" for="s-announce-body" data-i18n="admin.announceBody"></label>
              <textarea id="s-announce-body" name="announcementBody" maxlength="400" rows="3" dir="auto"
                        data-i18n-placeholder="admin.announceBodyPh"></textarea>
            </div>

            <button type="submit" class="btn" id="settings-save">
              <span data-icon="check"></span>
              <span data-i18n="admin.save"></span>
            </button>
          </form>
        </div>
      </section>

    </div>
  </main>

  <!-- ------------------- Fiche produit (ajout / édition) ------------------- -->
  <dialog id="product-dialog" class="dialog" aria-labelledby="dialog-title">
    <form id="product-form" method="dialog" novalidate>
      <header class="dialog__head">
        <h2 id="dialog-title" data-i18n="p.new"></h2>
        <button type="button" class="drawer__close" id="dialog-close" data-i18n-aria="p.cancel">
          <span data-icon="x"></span>
        </button>
      </header>

      <div class="dialog__body">
        <fieldset class="form-section">
          <legend data-i18n="p.secIdentity"></legend>
          <div class="form-grid">
            <div class="field" data-field="name">
              <label class="field__label" for="p-name">
                <span data-i18n="p.name"></span> <span class="req" aria-hidden="true">*</span>
              </label>
              <input type="text" id="p-name" name="name" maxlength="80" required dir="auto">
              <span class="field__error" data-error-for="name"></span>
            </div>
            <div class="field" data-field="category">
              <label class="field__label" for="p-category" data-i18n="p.category"></label>
              <select id="p-category" name="category" required></select>
              <span class="field__error" data-error-for="category"></span>
            </div>
            <div class="field" data-field="unit">
              <label class="field__label" for="p-unit" data-i18n="p.unit"></label>
              <select id="p-unit" name="unit" required></select>
              <span class="field__error" data-error-for="unit"></span>
            </div>
            <div class="field">
              <label class="field__label" for="p-description" data-i18n="p.description"></label>
              <textarea id="p-description" name="description" maxlength="300" dir="auto"></textarea>
            </div>
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend data-i18n="p.secPricing"></legend>
          <div class="form-grid">
            <div class="field" data-field="price">
              <label class="field__label" for="p-price" data-i18n="p.price"></label>
              <input type="number" id="p-price" name="price" min="0.1" max="1000" step="0.001" required
                     aria-describedby="p-price-hint">
              <span class="field__hint" id="p-price-hint" data-i18n="p.priceHint"></span>
              <span class="field__error" data-error-for="price"></span>
            </div>
            <div class="field" data-field="salePrice">
              <label class="field__label" for="p-sale-price" data-i18n="p.salePrice"></label>
              <input type="number" id="p-sale-price" name="salePrice" min="0" max="1000" step="0.001"
                     aria-describedby="p-sale-price-hint">
              <span class="field__hint" id="p-sale-price-hint" data-i18n="p.salePriceHint"></span>
              <span class="field__error" data-error-for="salePrice"></span>
            </div>
            <div class="field" data-field="stock">
              <label class="field__label" for="p-stock" data-i18n="p.stock"></label>
              <input type="number" id="p-stock" name="stock" min="0" max="100000" step="0.5" required>
              <span class="field__error" data-error-for="stock"></span>
            </div>
            <div class="field" data-field="step">
              <label class="field__label" for="p-step" data-i18n="p.step"></label>
              <input type="number" id="p-step" name="step" min="0.1" max="50" step="0.1" required
                     aria-describedby="p-step-hint">
              <span class="field__hint" id="p-step-hint" data-i18n="p.stepHint"></span>
              <span class="field__error" data-error-for="step"></span>
            </div>
            <div class="field" data-field="min">
              <label class="field__label" for="p-min" data-i18n="p.min"></label>
              <input type="number" id="p-min" name="min" min="0.1" max="100" step="0.1" required>
              <span class="field__error" data-error-for="min"></span>
            </div>
            <div class="field" data-field="max">
              <label class="field__label" for="p-max" data-i18n="p.max"></label>
              <input type="number" id="p-max" name="max" min="0.5" max="1000" step="0.5" required>
              <span class="field__error" data-error-for="max"></span>
            </div>
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend data-i18n="p.secOrigin"></legend>
          <div class="form-grid">
            <div class="field">
              <label class="field__label" for="p-farmer" data-i18n="p.farmer"></label>
              <input type="text" id="p-farmer" name="farmer" maxlength="80" dir="auto">
            </div>
            <div class="field">
              <label class="field__label" for="p-region" data-i18n="p.region"></label>
              <input type="text" id="p-region" name="region" maxlength="80" dir="auto">
            </div>
            <div class="field">
              <label class="field__label" for="p-harvested" data-i18n="p.harvested"></label>
              <input type="text" id="p-harvested" name="harvested" maxlength="60" dir="auto"
                     aria-describedby="p-harvested-hint">
              <span class="field__hint" id="p-harvested-hint" data-i18n="p.harvestedHint"></span>
            </div>
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend data-i18n="p.secMedia"></legend>

          <div class="photo-row">
            <div class="photo-preview" id="photo-preview"></div>
            <div>
              <label class="btn btn--ghost btn--sm" for="p-photo">
                <span data-icon="package"></span>
                <span data-i18n="p.photoChoose" id="photo-button-label"></span>
              </label>
              <input type="file" id="p-photo" name="photo" accept="image/jpeg,image/png,image/webp" hidden>
              <button type="button" class="btn btn--danger btn--sm" id="photo-remove" hidden>
                <span data-i18n="p.photoRemove"></span>
              </button>
              <p class="field__hint" data-i18n="p.photoHint"></p>
            </div>
          </div>

          <div class="field">
            <span class="field__label" data-i18n="p.illustration"></span>
            <div class="icon-picker" id="icon-picker" role="radiogroup" data-i18n-aria="p.illustration"></div>
          </div>
        </fieldset>
      </div>

      <footer class="dialog__foot">
        <button type="button" class="btn btn--ghost" id="dialog-cancel" data-i18n="p.cancel"></button>
        <button type="submit" class="btn" id="dialog-save">
          <span data-icon="check"></span>
          <span data-i18n="p.saveProduct"></span>
        </button>
      </footer>
    </form>
  </dialog>

  <!-- ---------------------- Offre (ajout / édition) ---------------------- -->
  <dialog id="promo-dialog" class="dialog" aria-labelledby="promo-dialog-title">
    <form id="promo-form" method="dialog" novalidate>
      <header class="dialog__head">
        <h2 id="promo-dialog-title" data-i18n="promo.new"></h2>
        <button type="button" class="drawer__close" id="promo-close" data-i18n-aria="p.cancel">
          <span data-icon="x"></span>
        </button>
      </header>

      <div class="dialog__body">
        <div class="field" data-field="title">
          <label class="field__label" for="promo-title">
            <span data-i18n="promo.title"></span> <span class="req" aria-hidden="true">*</span>
          </label>
          <input type="text" id="promo-title" name="title" maxlength="120" required dir="auto"
                 aria-describedby="promo-title-hint">
          <span class="field__hint" id="promo-title-hint" data-i18n="promo.titleHint"></span>
          <span class="field__error" data-error-for="title"></span>
        </div>

        <fieldset class="form-section promo-step">
          <legend>
            <span class="promo-step__num">1</span>
            <span data-i18n="promo.stepBuy"></span>
          </legend>

          <div class="form-grid">
            <div class="field" data-field="triggerType">
              <label class="field__label" for="promo-trigger-type" data-i18n="promo.triggerType"></label>
              <select id="promo-trigger-type" name="triggerType"></select>
              <span class="field__error" data-error-for="triggerType"></span>
            </div>
            <div class="field" data-field="triggerProductId" data-when-trigger="product contains">
              <label class="field__label" for="promo-trigger-product" data-i18n="promo.triggerProductLabel"></label>
              <select id="promo-trigger-product" name="triggerProductId"></select>
              <span class="field__hint" data-i18n="promo.triggerProductHint"></span>
              <span class="field__error" data-error-for="triggerProductId"></span>
            </div>
            <div class="field" data-field="triggerQty" data-when-trigger="product">
              <label class="field__label" for="promo-trigger-qty" data-i18n="promo.triggerQtyLabel"></label>
              <input type="number" id="promo-trigger-qty" name="triggerQty" min="0.1" max="1000" step="0.5">
              <span class="field__error" data-error-for="triggerQty"></span>
            </div>
            <div class="field" data-field="triggerAmount" data-when-trigger="subtotal">
              <label class="field__label" for="promo-trigger-amount" data-i18n="promo.triggerAmountLabel"></label>
              <input type="number" id="promo-trigger-amount" name="triggerAmount" min="0" max="1000" step="0.001">
              <span class="field__error" data-error-for="triggerAmount"></span>
            </div>
          </div>
        </fieldset>

        <div class="promo-flow" aria-hidden="true">
          <span class="promo-flow__arrow"></span>
        </div>

        <fieldset class="form-section promo-step">
          <legend>
            <span class="promo-step__num">2</span>
            <span data-i18n="promo.stepGet"></span>
          </legend>

          <div class="form-grid">
            <div class="field" data-field="rewardType">
              <label class="field__label" for="promo-reward-type" data-i18n="promo.rewardType"></label>
              <select id="promo-reward-type" name="rewardType"></select>
              <span class="field__error" data-error-for="rewardType"></span>
            </div>
            <div class="field" data-field="rewardScope" data-when-reward="percent amount">
              <label class="field__label" for="promo-reward-scope" data-i18n="promo.rewardScope"></label>
              <select id="promo-reward-scope" name="rewardScope"></select>
              <span class="field__error" data-error-for="rewardScope"></span>
            </div>
            <div class="field" data-field="rewardPercent" data-when-reward="percent">
              <label class="field__label" for="promo-reward-percent" data-i18n="promo.rewardPercentLabel"></label>
              <input type="number" id="promo-reward-percent" name="rewardPercent" min="1" max="100" step="1">
              <span class="field__error" data-error-for="rewardPercent"></span>
            </div>
            <div class="field" data-field="rewardAmount" data-when-reward="amount">
              <label class="field__label" for="promo-reward-amount" data-i18n="promo.rewardAmountLabel"></label>
              <input type="number" id="promo-reward-amount" name="rewardAmount" min="0.1" max="1000" step="0.001">
              <span class="field__error" data-error-for="rewardAmount"></span>
            </div>
            <div class="field" data-field="rewardMaxQty" data-when-reward="percent" data-when-scope="product">
              <label class="field__label" for="promo-reward-max" data-i18n="promo.rewardMaxQtyLabel"></label>
              <input type="number" id="promo-reward-max" name="rewardMaxQty" min="0" max="1000" step="0.5"
                     aria-describedby="promo-max-hint">
              <span class="field__hint" id="promo-max-hint" data-i18n="promo.rewardMaxQtyHint"></span>
              <span class="field__error" data-error-for="rewardMaxQty"></span>
            </div>
          </div>

          <div class="field" data-field="rewardProductIds" data-when-scope="product">
            <span class="field__label" id="promo-products-label" data-i18n="promo.rewardProductsLabel"></span>
            <span class="field__hint" data-i18n="promo.rewardProductsHint"></span>
            <div class="product-picker" id="promo-reward-products" role="group"
                 aria-labelledby="promo-products-label"></div>
            <span class="field__error" data-error-for="rewardProductIds"></span>
          </div>
        </fieldset>

        <!-- Ce qui sera reellement calcule : produit de reference a gauche,
             remise a droite. Ce bloc ne ment jamais, meme si le vendeur ecrit
             un texte libre different. -->
        <div class="promo-rule" id="promo-rule" aria-live="polite"></div>

        <div class="field" data-field="description">
          <label class="field__label" for="promo-description" data-i18n="promo.description"></label>
          <textarea id="promo-description" name="description" maxlength="200" rows="2" dir="auto"
                    aria-describedby="promo-description-hint"></textarea>
          <span class="field__hint" id="promo-description-hint" data-i18n="promo.descriptionHint"></span>
          <span class="field__error" data-error-for="description"></span>
        </div>

        <div class="switch-row">
          <label class="switch">
            <input type="checkbox" id="promo-active" name="active" checked>
            <span data-i18n="promo.active"></span>
          </label>
        </div>
      </div>

      <footer class="dialog__foot">
        <button type="button" class="btn btn--ghost" id="promo-cancel" data-i18n="p.cancel"></button>
        <button type="submit" class="btn" id="promo-save">
          <span data-icon="check"></span>
          <span data-i18n="promo.save"></span>
        </button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
