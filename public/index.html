<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="فلّاح — خضار وفواكه طازجة من المزارع مباشرة إلى باب منزلك. اطلب عبر الهاتف والدفع عند الاستلام. / Fallah : fruits et légumes frais, direct producteur, paiement à la livraison.">
  <meta name="theme-color" content="#15803d">
  <meta name="page-title-key" content="nav.shop">
  <title>فلّاح — منتجات طازجة من المزرعة</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="فلّاح">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="nav.shop">المنتجات</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">
          <img src="/straw_hat_logo.svg" alt="">
        </span>
        <span>
          <span data-i18n="brand.name">فلّاح</span>
          <small class="brand__tag" data-i18n="brand.tag">من المزرعة إلى باب منزلك</small>
        </span>
      </a>

      <nav class="site-nav" aria-label="Navigation">
        <a href="#products" data-i18n="nav.shop">المنتجات</a>
        <a href="#how" data-i18n="nav.how">كيفية الطلب</a>
        <a href="/track.html" data-i18n="nav.track">تتبّع طلبك</a>
        <a href="/admin.html" data-i18n="nav.admin">لوحة البائع</a>
        <button type="button" class="btn btn--ghost btn--sm" data-install hidden>
          <span data-icon="package"></span>
          <span data-i18n="pwa.install"></span>
        </button>
        <div class="lang-switch" data-lang-switch></div>
        <button type="button" class="btn btn--ghost btn--sm cart-btn always-visible" id="open-cart" data-i18n-aria="nav.cart">
          <span data-icon="cart"></span>
          <span data-i18n="nav.cart">السلة</span>
          <span class="cart-btn__count" data-cart-count hidden>0</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- ---------------------------- Hero ---------------------------- -->
    <section class="hero">
      <div class="container hero__grid">
        <div>
          <span class="hero__eyebrow">
            <span data-icon="sprout"></span>
            <span data-i18n="hero.eyebrow">قُطف اليوم من مزارع تونسية</span>
          </span>
          <h1 style="margin-block-start: var(--space-4)" data-i18n="hero.title">خضار وفواكه طازجة، من المزارع مباشرة إلى منزلك</h1>
          <p class="lead" data-i18n="hero.lead"></p>
          <div class="hero__actions">
            <a class="btn" href="#products">
              <span data-icon="cart"></span>
              <span data-i18n="hero.cta">اطلب الآن</span>
            </a>
            <a class="btn btn--ghost" href="#how" data-i18n="hero.how">كيف تعمل الخدمة؟</a>
          </div>
        </div>
        <div class="hero__art" id="hero-art" aria-hidden="true"></div>
      </div>
    </section>

    <!-- ------------------------ Comment ça marche ------------------- -->
    <section class="section" id="how">
      <div class="container">
        <div class="center reveal" style="margin-block-end: var(--space-6)">
          <h2 data-i18n="steps.title"></h2>
          <p class="muted" data-i18n="steps.sub"></p>
        </div>
        <div class="steps">
          <article class="step reveal">
            <div class="step__num">1</div>
            <h3 data-i18n="step1.title"></h3>
            <p data-i18n="step1.desc"></p>
          </article>
          <article class="step reveal">
            <div class="step__num">2</div>
            <h3 data-i18n="step2.title"></h3>
            <p data-i18n="step2.desc"></p>
          </article>
          <article class="step reveal">
            <div class="step__num">3</div>
            <h3 data-i18n="step3.title"></h3>
            <p data-i18n="step3.desc"></p>
          </article>
          <article class="step reveal">
            <div class="step__num">4</div>
            <h3 data-i18n="step4.title"></h3>
            <p data-i18n="step4.desc"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- ---------------------------- Catalogue ----------------------- -->
    <section class="section" id="products" style="background: var(--bg-alt)">
      <div class="container">
        <div style="margin-block-end: var(--space-5)">
          <h2 data-i18n="catalog.title"></h2>
          <p class="muted" data-i18n="catalog.sub"></p>
        </div>

        <div class="catalog-bar">
          <div class="search-field">
            <span data-icon="search"></span>
            <label class="visually-hidden" for="search" data-i18n="catalog.searchLabel"></label>
            <input type="search" id="search" data-i18n-placeholder="catalog.search" autocomplete="off">
          </div>
          <div class="chips" id="categories" role="group" data-i18n-aria="catalog.title"></div>
        </div>

        <div class="product-grid" id="product-grid" aria-live="polite" aria-busy="true">
          <div class="skeleton"></div><div class="skeleton"></div>
          <div class="skeleton"></div><div class="skeleton"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ------------------------------ Panier -------------------------- -->
  <div class="drawer-backdrop" id="cart-backdrop" hidden></div>
  <aside class="drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title" hidden>
    <div class="drawer__head">
      <span data-icon="cart" style="color: var(--primary)"></span>
      <h2 id="cart-title" data-i18n="cart.title"></h2>
      <button type="button" class="drawer__close" id="close-cart" data-i18n-aria="cart.remove">
        <span data-icon="x"></span>
      </button>
    </div>
    <div class="drawer__body" id="cart-body"></div>
    <div class="drawer__foot" id="cart-foot" hidden>
      <div class="totals" id="cart-totals"></div>
      <a class="btn btn--accent btn--block" href="/checkout.html">
        <span data-i18n="cart.checkout"></span>
        <span data-icon="arrow"></span>
      </a>
    </div>
  </aside>

  <!-- ------------------------------ Footer -------------------------- -->
  <footer class="site-footer">
    <div class="container site-footer__grid">
      <div>
        <h3 data-i18n="footer.about"></h3>
        <p data-i18n="footer.aboutText"></p>
      </div>
      <div>
        <h3 data-i18n="footer.contact"></h3>
        <p><a data-shop-phone href="tel:">+216 00 000 000</a></p>
        <p data-i18n="footer.hours"></p>
      </div>
      <div>
        <h3 data-i18n="footer.links"></h3>
        <p><a href="#products" data-i18n="nav.shop"></a></p>
        <p><a href="/track.html" data-i18n="nav.track"></a></p>
        <p><a href="/admin.html" data-i18n="nav.admin"></a></p>
      </div>
    </div>
    <div class="container site-footer__bottom">
      <span data-i18n="brand.name"></span> © <span id="year"></span> — <span data-i18n="footer.rights"></span>
    </div>
  </footer>

  <script type="module" src="/js/shop.js"></script>
</body>
</html>
