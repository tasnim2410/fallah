<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#15803d">
  <meta name="page-title-key" content="track.title">
  <title>تبّع طلبيتك — فلاّح</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="track.title"></a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 3C9 3 4 8 4 15c0 2 .6 4 1.6 5.4"/><path d="M4.5 20.5C9 13 14 9.5 19 8"/>
          </svg>
        </span>
        <span>
          <span data-i18n="brand.name"></span>
          <small class="brand__tag" data-i18n="brand.tag"></small>
        </span>
      </a>
      <nav class="site-nav" aria-label="Navigation">
        <a href="/" data-i18n="nav.shop"></a>
        <div class="lang-switch" data-lang-switch></div>
      </nav>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container" style="max-width: 720px">
      <h1 data-i18n="track.title"></h1>
      <p class="muted" data-i18n="track.sub"></p>

      <form class="panel" id="track-form" novalidate style="margin-block-start: var(--space-4)">
        <div class="field">
          <label class="field__label" for="reference" data-i18n="track.ref"></label>
          <input type="text" id="reference" name="reference" required dir="ltr"
                 data-i18n-placeholder="track.refPh" autocomplete="off" maxlength="24">
        </div>
        <div class="field">
          <label class="field__label" for="phone" data-i18n="form.phone"></label>
          <div class="phone-input">
            <span class="phone-input__prefix" dir="ltr">+216</span>
            <input type="tel" id="phone" name="phone" inputmode="numeric" required
                   data-i18n-placeholder="form.phonePh" maxlength="14">
          </div>
        </div>
        <button type="submit" class="btn btn--block" id="track-btn">
          <span data-icon="search"></span>
          <span data-i18n="track.submit"></span>
        </button>
      </form>

      <div id="result" aria-live="polite"></div>
    </div>
  </main>

  <script type="module" src="/js/track.js"></script>
</body>
</html>
